name = "gymzapisnik-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Workers AI on the Workers Free plan: 10,000 Neurons/day, no card, no API key
# in the app. The Free plan is never charged; once the daily allocation is used
# up the model returns error 4006 and the Worker answers 429 `quota_global`
# until the next UTC day.
[ai]
binding = "AI"

# Daily quota counters. Create with `npx wrangler kv namespace create QUOTA`
# and paste the returned id here before the first deploy.
[[kv_namespaces]]
binding = "QUOTA"
id = "4b5ad09973964d7eb0fb617d0a1e7c02"

[vars]
MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
# Comma-separated browser origins allowed to call the API (PWA hosting).
# Native apps send no Origin header and are always allowed.
ALLOWED_ORIGINS = "https://gymzapisnik-app.gymzapisnik-ai.workers.dev,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8099,http://127.0.0.1:8099"
FRIDGE_PER_INSTALL = "8"
MEALS_PER_INSTALL = "20"
MACHINE_PER_INSTALL = "10"
COACH_PER_INSTALL = "20"
# Reserved model calls per day for all testers (2 per request for a retry).
# KV counts are approximate under concurrent traffic; the provider Free plan
# is the cost boundary. Tokens and image size determine Neuron consumption.
GLOBAL_DAILY_CAP = "100"

[observability]
enabled = false
