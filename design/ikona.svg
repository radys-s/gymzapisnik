<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs>
<radialGradient id="bloom" cx="50%" cy="55%" r="55%">
  <stop offset="0" stop-color="#76b900" stop-opacity=".45"/>
  <stop offset=".5" stop-color="#2f5200" stop-opacity=".18"/>
  <stop offset="1" stop-color="#000" stop-opacity="0"/>
</radialGradient>
